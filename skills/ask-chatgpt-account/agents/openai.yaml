interface:
  display_name: "ChatGPT Parallel Worker"
  short_description: "Deep ChatGPT reasoning and threaded follow-ups"
  default_prompt: "Use $ask-chatgpt-account for standalone deep reasoning, safe explicit attachments, generated files, or a follow-up in a completed ChatGPT conversation; preserve each new reply job ID."
dependencies:
  tools:
    - type: "mcp"
      value: "chatgpt-chrome-bridge"
      description: "Context-isolated ChatGPT worker with exact-thread replies, focus-safe background launch, bounded local retention, generated-file retrieval, durable Pro status, and browser inspection"
policy:
  allow_implicit_invocation: true
