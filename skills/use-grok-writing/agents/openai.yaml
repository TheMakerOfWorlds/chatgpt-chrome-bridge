interface:
  display_name: "Grok Natural Writing Worker"
  short_description: "Natural prose through Jackson Personal Grok"
  default_prompt: "Use $use-grok-writing proactively when standalone natural writing or rewriting is a good fit. Check shared availability first, skip Grok without retrying when unavailable, give it every required fact explicitly, use Fast by default, and retain each job ID until completion."
dependencies:
  tools:
    - type: "mcp"
      value: "grok-chrome-bridge"
      description: "Context-isolated Grok writing worker with shared availability tracking, Jackson Stone Personal profile binding, dynamic models, attachments, concurrent queues, status, browser recovery, and idle close"
policy:
  allow_implicit_invocation: true
