interface:
  display_name: "Grok Natural Writing Worker"
  short_description: "Natural prose through Jackson Personal Grok"
  default_prompt: "Use $use-grok-writing for standalone natural writing or rewriting; give Grok every required fact explicitly, use Fast by default, and keep each concurrent job ID until it completes."
dependencies:
  tools:
    - type: "mcp"
      value: "grok-chrome-bridge"
      description: "Context-isolated Grok writing worker with Jackson Stone Personal profile binding, dynamic models, attachments, concurrent queues, status, browser recovery, and idle close"
policy:
  allow_implicit_invocation: true
